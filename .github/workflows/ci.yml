name: CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:
  schedule:
    # Lunes 13:17 UTC — escaneo semanal aunque no haya pushes
    - cron: '17 13 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Mínimo privilegio para todo el workflow. Trivy falla el job (exit-code 1)
# y no publica SARIF, así que no hace falta security-events: write.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests unitarios e integración
        run: pnpm test
      - name: Tests de seguridad
        run: pnpm test:seguridad
      # Política: este paso bloquea solo high/critical del árbol de producción.
      # Los moderate de producción se informan abajo y no bloquean el job:
      # subir el umbral exige impacto demostrado en el runtime de Abyssan.
      # vitest queda fuera de --prod (devDependency de la raíz).
      - name: Auditoría de dependencias (prod, high/critical)
        run: pnpm audit --prod --audit-level high
      - name: Informe de advisories moderados de producción
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true
      - name: Build
        run: pnpm build

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem del repositorio
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: server-dev
            dockerfile: apps/server/Dockerfile
            image: abyssan-server:dev
          - id: server-prod
            dockerfile: apps/server/Dockerfile.prod
            image: abyssan-server:prod
          - id: web-dev
            dockerfile: apps/web/Dockerfile
            image: abyssan-web:dev
          - id: web-prod
            dockerfile: apps/web/Dockerfile.prod
            image: abyssan-web:prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.id }}
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} .
      # El árbol de la aplicación en la imagen sale limpio (Express, qs, simple-git).
      # Estas rutas no son el proceso que sirve Abyssan (`node dist/index.js`):
      # - npm CLI que trae node:22-alpine
      # - pnpm 11.25.0 que instala Corepack en COREPACK_HOME (undici embebido)
      # - binario de esbuild 0.25.12 (Vite), compilado con Go 1.23.12
      # OS y el resto de node_modules siguen fallando el job en CRITICAL/HIGH.
      - name: Trivy imagen ${{ matrix.id }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: "/usr/local/lib/node_modules/npm,/usr/local/share/corepack,/app/node_modules/.pnpm/esbuild@0.25.12,/app/node_modules/.pnpm/@esbuild+linux-x64@0.25.12"
