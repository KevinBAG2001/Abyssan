name: CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests unitarios e integración
        run: pnpm test
      - name: Tests de seguridad
        run: pnpm test:seguridad
      - name: Auditoría de dependencias (prod)
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm build

  imagenes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen de desarrollo (server)
        run: docker build -f apps/server/Dockerfile .
      - name: Build imagen de producción (server)
        run: docker build -f apps/server/Dockerfile.prod .
      - name: Build imagen de producción (web)
        run: docker build -f apps/web/Dockerfile.prod .
      - name: Escaneo Trivy del Dockerfile de producción del server
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
