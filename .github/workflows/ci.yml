name: CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:

# Mínimo privilegio para todo el workflow. Trivy falla el job (exit-code 1)
# y no publica SARIF, así que no hace falta security-events: write.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests unitarios e integración
        run: pnpm test
      - name: Tests de seguridad
        run: pnpm test:seguridad
      # Política: este paso bloquea solo high/critical del árbol de producción.
      # Los moderate de producción se informan abajo y no bloquean el job:
      # subir el umbral exige impacto demostrado en el runtime de Abyssan.
      # vitest queda fuera de --prod (devDependency de la raíz).
      - name: Auditoría de dependencias (prod, high/critical)
        run: pnpm audit --prod --audit-level high
      - name: Informe de advisories moderados de producción
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true
      - name: Build
        run: pnpm build

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem del repositorio
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  imagenes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: server-dev
            dockerfile: apps/server/Dockerfile
            image: abyssan-server:dev
          - id: server-prod
            dockerfile: apps/server/Dockerfile.prod
            image: abyssan-server:prod
          - id: web-dev
            dockerfile: apps/web/Dockerfile
            image: abyssan-web:dev
          - id: web-prod
            dockerfile: apps/web/Dockerfile.prod
            image: abyssan-web:prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build ${{ matrix.id }}
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} .
      # El árbol de la aplicación en la imagen sale limpio (Express, qs, simple-git).
      # Estas rutas no son el proceso que sirve Abyssan (`node dist/index.js`):
      # - npm CLI que trae node:22-alpine
      # - binario de esbuild 0.25.12 (Vite), compilado con Go 1.23.12
      # OS y el resto de node_modules siguen fallando el job en CRITICAL/HIGH.
      - name: Trivy imagen ${{ matrix.id }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: "/usr/local/lib/node_modules/npm,/app/node_modules/.pnpm/esbuild@0.25.12,/app/node_modules/.pnpm/@esbuild+linux-x64@0.25.12"
