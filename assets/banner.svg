  <rect width="1440" height="520" rx="28" fill="url(#halo)"/>
  <rect width="1440" height="520" rx="28" fill="url(#halo2)"/>
  <rect x="1.5" y="1.5" width="1437" height="517" rx="26.5" fill="none" stroke="#23283b" stroke-width="1.5"/>

