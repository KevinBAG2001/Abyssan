# Compose de producción (ciclo 2). No sustituye el compose de desarrollo.
# El API corre como no-root, sin fallback a root y sin safe.directory '*'.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.prod
    container_name: abyssan-server-prod
    restart: unless-stopped
    user: "abyssan"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - BIND_HOST=0.0.0.0
      - NODE_ENV=production
      - PROJECTS_ROOT=/workspace/proyectos
      - CORS_ORIGINS=http://localhost:5174,http://127.0.0.1:5174
      - ABYSSAN_API_TOKEN=${ABYSSAN_API_TOKEN:?Defina ABYSSAN_API_TOKEN en el archivo .env}
      - ABYSSAN_HOME=/abyssan-home
      - GIT_TERMINAL_PROMPT=0
    volumes:
      - ${ABYSSAN_PROJECTS_HOST:?Defina ABYSSAN_PROJECTS_HOST}:/workspace/proyectos
      - ${ABYSSAN_HOME_HOST:-abyssan-home-prod}:/abyssan-home
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - abyssan-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: abyssan-web-prod
    restart: unless-stopped
    user: "abyssan"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
    networks:
      - abyssan-net

networks:
  abyssan-net:
    driver: bridge

volumes:
  abyssan-home-prod:
