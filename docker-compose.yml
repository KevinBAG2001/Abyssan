services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: abyssan-server
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: Abyssan
      org.opencontainers.image.description: Cliente Git gráfico auto-hospedable
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - BIND_HOST=0.0.0.0
      - NODE_ENV=development
      - CI=true
      - PROJECTS_ROOT=/workspace/proyectos
      - CORS_ORIGINS=http://localhost:5174,http://127.0.0.1:5174
      - ABYSSAN_API_TOKEN=${ABYSSAN_API_TOKEN:?Defina ABYSSAN_API_TOKEN en el archivo .env}
      - ABYSSAN_HOME=/abyssan-home
      - GIT_TERMINAL_PROMPT=0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID:-}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET:-}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:-http://localhost:3001/api/auth/callback}
      - ABYSSAN_SECRETO_CIFRADO=${ABYSSAN_SECRETO_CIFRADO:-}
      - ABYSSAN_GITHUB_TOKEN=${ABYSSAN_GITHUB_TOKEN:-}
      - ABYSSAN_GITLAB_TOKEN=${ABYSSAN_GITLAB_TOKEN:-}
      - VITE_API_URL=http://localhost:3001
    volumes:
      # RW a propósito: stage/commit/push escriben en .git. Si el UID del host
      # no coincide con node, el entrypoint corre Git como root en el contenedor.
      # Por defecto solo este checkout. Para varios repos: ABYSSAN_PROJECTS_HOST en .env
      - ${ABYSSAN_PROJECTS_HOST:-.}:/workspace/proyectos
      - ./apps/server/src:/app/apps/server/src
      # Identidad git del host (user.name / user.email). El archivo debe existir;
      # si Docker crea una carpeta aquí, borra esa carpeta y corrige la ruta.
      - ${ABYSSAN_GITCONFIG_HOST:-./apps/server/docker/gitconfig.host.placeholder}:/host-gitconfig:ro
      # Tokens OAuth cifrados / PAT no van en el repo. Named volume por defecto;
      # o ABYSSAN_HOME_HOST=C:/Users/tu_usuario/.abyssan para compartir con pnpm dev:server
      - ${ABYSSAN_HOME_HOST:-abyssan-home}:/abyssan-home
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - abyssan-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: abyssan-web
    restart: unless-stopped
    labels:
      org.opencontainers.image.title: Abyssan
      org.opencontainers.image.description: SPA del cliente Git Abyssan
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
      - CI=true
      - VITE_ABYSSAN_API_TOKEN=${ABYSSAN_API_TOKEN:?Defina ABYSSAN_API_TOKEN en el archivo .env}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    depends_on:
      server:
        condition: service_healthy
    networks:
      - abyssan-net

networks:
  abyssan-net:
    driver: bridge

volumes:
  abyssan-home:
